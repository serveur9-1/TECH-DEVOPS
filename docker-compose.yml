# Développement local : construit les images à partir des sources.
# La production utilise docker-compose.prod.yml, qui est autonome.
name: task-manager

services:
  db:
    image: postgres:17-alpine
    container_name: task-manager-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      # Valeur de confort pour le développement. En production, GitHub Actions
      # crée /opt/task-manager/.env au premier déploiement.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Non publié : joignable uniquement depuis le réseau Compose.
    expose:
      - "5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # pg_isready, et non un simple « port ouvert » : PostgreSQL écoute avant
      # d'accepter les connexions, le backend démarrerait trop tôt.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    image: task-manager-backend:latest
    container_name: task-manager-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:-tasks}@db:5432/${POSTGRES_DB:-tasks}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # python est déjà dans l'image, inutile d'y ajouter curl.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: task-manager-frontend:latest
    container_name: task-manager-frontend
    ports:
      # Seul point d'entrée public de l'application.
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        # Nginx résout le nom "backend" au chargement de sa configuration :
        # s'il n'est pas encore là, Nginx refuse de démarrer.
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # wget est fourni par busybox dans nginx:alpine.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db-data:
