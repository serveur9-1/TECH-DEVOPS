# Configuration HTTP. C'est celle qui est intégrée à l'image et utilisée en
# développement. En production, Ansible la remplace par la variante HTTPS dès
# qu'un nom de domaine est fourni (voir ansible/templates/nginx-https.conf.j2).

# N'annonce pas le numéro de version de Nginx dans les réponses et les pages
# d'erreur : une information de moins pour qui cherche une faille connue.
server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/css text/plain application/javascript application/json;

server {
    listen 80;
    server_name _;

    # Les fichiers servis contiennent des accents.
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # L'API n'échange que de petits objets JSON ; plafonner le corps des
    # requêtes coupe court aux envois volumineux destinés à saturer le disque.
    client_max_body_size 64k;

    # « always » : les en-têtes sont aussi posés sur les réponses d'erreur.
    # La CSP peut rester stricte parce que la page n'a ni script ni style
    # en ligne, tout est servi depuis la même origine.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Sonde du conteneur frontend, distincte de /api/health qui teste le
    # backend : elle doit répondre même si le backend est tombé.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Validation Let's Encrypt. Présente dès la configuration HTTP, sinon le
    # tout premier certificat ne pourrait jamais être émis.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Le "/" final retire le préfixe /api : /api/tasks -> /tasks.
        # Sans lui, FastAPI recevrait /api/tasks et répondrait 404.
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
