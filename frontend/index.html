<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Indique au navigateur que les deux thèmes sont gérés : il adapte les
         couleurs par défaut des champs de formulaire et des barres de défilement. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gestionnaire de tâches simple." />
    <title>Task Manager</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card-header">
        <h1>Task Manager</h1>
        <p class="counter" id="task-counter" aria-live="polite"></p>
      </header>

      <form id="task-form" autocomplete="off">
        <input
          id="task-title"
          type="text"
          maxlength="200"
          placeholder="Nouvelle tâche..."
          aria-label="Titre de la tâche"
          required
        />
        <button type="submit">Ajouter</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <ul id="task-list" class="task-list"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
