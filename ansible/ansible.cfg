[defaults]
inventory          = inventory.ini
stdout_callback    = yaml
interpreter_python = auto_silent
# Le playbook n'utilise que les modules d'ansible-core : aucune collection
# externe n'est à installer avant de jouer.

[privilege_escalation]
become        = true
become_method = sudo

[ssh_connection]
# Réutilise la connexion SSH entre les tâches : un playbook de cette taille
# passe sinon plus de temps à se connecter qu'à travailler.
pipelining = true
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
