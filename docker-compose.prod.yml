# Fichier de production AUTONOME (il ne surcharge pas docker-compose.yml).
# Installé par Ansible dans /opt/task-manager/ en root:root et exécuté par
# root : tout chemin qu'il référence est une élévation de privilèges
# potentielle. Pas de section build:, pas de chemin relatif, et ses seuls
# montages hôte pointent vers des répertoires root:root que le script de
# déploiement revalide à chaque exécution.
#
#   IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d
#
# Les variables viennent de /opt/task-manager/.env (root:root, mode 0600).
name: task-manager

services:
  db:
    image: postgres:17-alpine
    container_name: task-manager-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB est obligatoire}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER est obligatoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    # IMAGE_TAG est obligatoire : pas de retour silencieux sur « latest », on
    # déploie exactement l'image construite par la pipeline.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE est obligatoire}:${IMAGE_TAG:?IMAGE_TAG est obligatoire}
    container_name: task-manager-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE est obligatoire}:${IMAGE_TAG:?IMAGE_TAG est obligatoire}
    container_name: task-manager-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Ansible écrit ici la variante HTTP ou HTTPS, sans reconstruire l'image.
      - /opt/task-manager/nginx:/etc/nginx/conf.d:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db-data:
    # Nom explicite : il reste le même quel que soit le nom de projet Compose,
    # ce qui évite de recréer une base vide après un déploiement lancé depuis
    # un autre répertoire.
    name: task-manager_db-data
  certbot-conf:
    name: task-manager_certbot-conf
  certbot-www:
    name: task-manager_certbot-www
