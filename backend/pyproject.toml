# Règles listées explicitement : les valeurs par défaut de Ruff changent d'une
# version à l'autre, et la CI doit rendre le même verdict que le poste local.
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RET"]

[tool.ruff.lint.isort]
# Sans cela, Ruff prend « main » pour une bibliothèque tierce.
known-first-party = ["main", "conftest"]
