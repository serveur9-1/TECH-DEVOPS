name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

# Évite deux déploiements concurrents sur le même serveur.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Compte du registre, en variable de dépôt pour ne pas le figer dans le code.
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}

jobs:
  lint:
    name: Qualité du code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les outils de développement
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff — règles de style et erreurs probables
        run: ruff check backend

      - name: Ruff — formatage
        run: ruff format --check backend

      - name: Hadolint — Dockerfile du backend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Hadolint — Dockerfile du frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform — formatage et validation
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  test:
    name: Tests backend
    runs-on: ubuntu-24.04
    # Vrai PostgreSQL : les tests valident le SQL réellement envoyé en prod.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tasks_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Même version que backend/Dockerfile, pour tester ce qui part en prod.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r backend/requirements-dev.txt

      - name: Lancer pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasks_test
        run: python -m pytest -v

  security:
    name: Analyse de sécurité du dépôt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Dépendances vulnérables, secrets en clair et mauvaises configurations
      # dans les Dockerfile, les fichiers Compose et le code Terraform.
      - name: Trivy — système de fichiers
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Publier le rapport dans l'onglet Security
        uses: github/codeql-action/upload-sarif@v3
        # Le code scanning n'est pas disponible sur tous les plans.
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy — échec sur vulnérabilité critique corrigeable
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          # Sans correctif publié, une alerte n'est pas actionnable : elle est
          # signalée dans le rapport mais ne bloque pas la livraison.
          ignore-unfixed: true
          format: table
          exit-code: "1"

  build:
    name: Image ${{ matrix.name }}
    needs: [lint, test, security]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          # Contexte = racine du dépôt : l'image Nginx copie frontend/ et nginx/.
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image localement
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Chargée dans le démon : Trivy doit l'inspecter avant publication.
          load: true
          push: false
          tags: task-manager-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy — analyse de l'image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: task-manager-${{ matrix.name }}:ci
          # HIGH reste dans le rapport du scan fs. Ici on ne bloque la
          # publication que sur CRITICAL corrigeable, pour ne pas coller la
          # livraison à une CVE d'image de base sans lien avec notre code.
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # Sur une Pull Request on s'arrête ici : aucun secret n'est manipulé.
      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/task-manager-${{ matrix.name }}:latest
            ${{ env.REGISTRY_NAMESPACE }}/task-manager-${{ matrix.name }}:${{ github.sha }}
          # Cache réutilisé : l'image publiée est celle qu'a vue Trivy.
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autoriser SSH depuis l'IP du runner
        id: sg
        run: |
          set -euo pipefail
          IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "runner_ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${IP}/32,Description=gha-temp}]" \
            || true
          sleep 5

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copier Compose, Nginx et le script
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh "$EC2_USER@$EC2_HOST" 'sudo mkdir -p /opt/task-manager/nginx && sudo chown -R ubuntu:ubuntu /opt/task-manager'
          scp docker-compose.prod.yml "$EC2_USER@$EC2_HOST:/opt/task-manager/docker-compose.prod.yml"
          scp nginx/default.conf "$EC2_USER@$EC2_HOST:/opt/task-manager/nginx/default.conf"
          scp scripts/ec2-deploy.sh "$EC2_USER@$EC2_HOST:/opt/task-manager/ec2-deploy.sh"
          ssh "$EC2_USER@$EC2_HOST" 'chmod 700 /opt/task-manager/ec2-deploy.sh'

      - name: Déployer le tag ${{ github.sha }}
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_NAMESPACE: ${{ env.REGISTRY_NAMESPACE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          DEPLOY_ENV=$(mktemp)
          {
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export REGISTRY_NAMESPACE=%q\n' "$REGISTRY_NAMESPACE"
            printf 'export POSTGRES_PASSWORD=%q\n' "$POSTGRES_PASSWORD"
            printf 'export DOCKERHUB_USERNAME=%q\n' "$DOCKERHUB_USERNAME"
            printf 'export DOCKERHUB_TOKEN=%q\n' "$DOCKERHUB_TOKEN"
          } > "$DEPLOY_ENV"
          scp "$DEPLOY_ENV" "$EC2_USER@$EC2_HOST:/opt/task-manager/.deploy.env"
          rm -f "$DEPLOY_ENV"
          ssh "$EC2_USER@$EC2_HOST" \
            'chmod 600 /opt/task-manager/.deploy.env && set -a && . /opt/task-manager/.deploy.env && set +a && rm -f /opt/task-manager/.deploy.env && /opt/task-manager/ec2-deploy.sh'

      - name: Vérifier HTTP
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --max-time 5 "http://$EC2_HOST/healthz"
          curl -fsS --max-time 5 "http://$EC2_HOST/api/health"

      - name: Retirer l'accès SSH temporaire
        if: always()
        run: |
          set -euo pipefail
          IP="${{ steps.sg.outputs.runner_ip }}"
          [ -n "$IP" ] || exit 0
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${IP}/32" \
            || true
